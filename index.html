function spriteUrl(id) { return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`; }
function spriteBack(id) { return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/${id}.png`; }

function parsePokemonEntry(entry) {
    const [id, name, types, stats, movesRaw] = entry;
    return {
        id, name, types,
        stats: { hp: stats.hp, attack: stats.atk, defense: stats.def, spAttack: stats.spa, spDefense: stats.spd, speed: stats.spe },
        moves: movesRaw.map(([n,t,pw,ac,cl]) => ({ name:n, type:t, power:pw, accuracy:ac, damageClass: cl==='p'?'physical':'special' })),
        spriteUrl: spriteUrl(id), spriteBack: spriteBack(id)
    };
}

function pickRandomPokemon(count) {
    const shuffled = [...POKEMON_DB].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, count).map(parsePokemonEntry);
}

function createBattleInstance(p) {
    const hp = Math.floor(((2 * p.stats.hp) * POKEMON_LEVEL / 100) + POKEMON_LEVEL + 10);
    return { ...p, hp, maxHp: hp, attack: p.stats.attack, defense: p.stats.defense,
        spAttack: p.stats.spAttack, spDefense: p.stats.spDefense, speed: p.stats.speed, isFainted: false };
}

function calculateDamage(attacker, defender, move) {
    if (move.power === 0) return { damage: 0, missed: false, effectiveness: 1, critical: false, isStatus: true };
    if (Math.random() * 100 > move.accuracy) return { damage: 0, missed: true, effectiveness: 1, critical: false };
    let a = move.damageClass === 'physical' ? attacker.attack : attacker.spAttack;
    let d = move.damageClass === 'physical' ? defender.defense : defender.spDefense;
    let dmg = Math.floor((((2*POKEMON_LEVEL/5+2) * move.power * a / d) / 50) + 2);
    const crit = Math.random() < 1/16;
    if (crit) dmg = Math.floor(dmg * 1.5);
    if (attacker.types.includes(move.type)) dmg = Math.floor(dmg * 1.5);
    const eff = getTypeEffectiveness(move.type, defender.types);
    dmg = Math.floor(dmg * eff);
    dmg = Math.max(1, Math.floor(dmg * ((Math.floor(Math.random()*16)+85)/100)));
    if (eff === 0) dmg = 0;
    return { damage: dmg, missed: false, effectiveness: eff, critical: crit };
}

            promptPrefix.classList.remove("text-green-400");
            promptPrefix.classList.add("text-yellow-400");
            state = 'game_menu';
        } else if (input === 'no') {
            printToTerminal("Loading professional profile...", 'text-blue-300');
            printToTerminal("Type 'help' for commands.", 'text-gray-300');
            state = 'menu';
        } else {
            printToTerminal("Please type 'yes' or 'no'.", 'text-red-400');
            printToTerminal(firstQuestion, 'text-yellow-300');
        }
    } else if (state === 'menu') {
        const c = commands[input];
        if (c) { if (input==='clear'){terminalOutput.innerHTML='';return;} if(Array.isArray(c))c.forEach(l=>printToTerminal(l));else printToTerminal(c); }
        else if (input) printToTerminal(`Not found: ${input}. Type 'help'.`, 'text-red-400');
    } else if (state === 'game_menu') {
        if (input==='clear'){terminalOutput.innerHTML='';return;}
        if (input==='help') {
            printToTerminal("═══ POKÉDEX — Pick 3 for your team ═══", 'text-yellow-400 font-bold');
            gameCommandKeys.forEach(k => {
                const p = commandToPokemonMap[k];
                if (p) {
                    const ts = p.types.map(t=>t.toUpperCase()).join('/');
                    printToTerminal(`  '${k.padEnd(10)}' → #${String(p.id).padStart(3,'0')} ${p.name} [${ts}]`);
                    printToTerminal(`             HP:${p.stats.hp} ATK:${p.stats.attack} DEF:${p.stats.defense} SPA:${p.stats.spAttack} SPD:${p.stats.spDefense} SPE:${p.stats.speed}`, 'text-gray-500');
                }
            });
            printToTerminal("  'help'  /  'clear'"); return;
        }
        const pd = commandToPokemonMap[input];
        if (!pd) { if(input) printToTerminal(`Not found: ${input}. Type 'help'.`, 'text-red-400'); return; }
        const ts = pd.types.map(t=>t.toUpperCase()).join('/');
        printToTerminal(`#${String(pd.id).padStart(3,'0')} ${pd.name} [${ts}]`, 'text-cyan-300');
        printToTerminal(`  HP:${pd.stats.hp} ATK:${pd.stats.attack} DEF:${pd.stats.defense} SPA:${pd.stats.spAttack} SPD:${pd.stats.spDefense} SPE:${pd.stats.speed}`, 'text-gray-400');
        pd.moves.forEach(m => {
            const cls = m.damageClass==='physical'?'PHY':'SPE';
            printToTerminal(`  ▸ ${m.name} [${m.type.toUpperCase()}] ${cls} PWR:${m.power} ACC:${m.accuracy}%`, 'text-gray-500');
        });
        if (gameCommandCounter < 3) {
            if (playerTeam.find(p=>p.name===pd.name)) printToTerminal(`→ ${pd.name} already on team!`, 'text-yellow-400');
            else { playerTeam.push(createBattleInstance(pd)); gameCommandCounter++; printToTerminal(`→ ${pd.name} joined! [${gameCommandCounter}/3]`, 'text-cyan-400'); }
        }
        if (gameCommandCounter === 3) {
            printToTerminal(" "); printToTerminal("Team full!", 'text-green-400 font-bold');
            printToTerminal(`Your team: [${playerTeam.map(p=>p.name).join(', ')}]`, 'text-cyan-400');
            const pn = new Set(playerTeam.map(p=>p.name));
            enemyTeam = selectedPokemon.filter(p=>!pn.has(p.name)).map(p=>createBattleInstance(p));
            printToTerminal(`Opponent: [${enemyTeam.map(p=>p.name).join(', ')}]`, 'text-orange-400');
            state='battle'; battleState='player_turn';
            promptPrefix.textContent="battle@portfolio:~$";
            promptPrefix.classList.remove("text-yellow-400"); promptPrefix.classList.add("text-red-500");
            gameCommandCounter=4; await startBattle();
        }
    } else if (state === 'battle') {
        if (battleState==='game_over'){if(input==='reset')resetGame();else printToTerminal("Type 'reset' to play again.",'text-yellow-300');return;}
        if (battleState!=='player_turn'){printToTerminal("Not your turn!",'text-red-400');return;}
        if (input==='reset'){resetGame();return;}
        if (input==='help'){printToTerminal("'moves' 'status' 'team' '1'-'4' 'reset'");return;}
        if (input==='moves'){listMoves();return;}
        if (input==='status'){printBattleStatus();return;}
        if (input==='team'){printTeamStatus();return;}
        const mi=parseInt(input)-1;
        if(mi>=0&&mi<4)await executeBattleRound(mi);
        else printToTerminal("Type 'moves' or '1'-'4'.",'text-red-400');
    }
}

async function loadAndDisplayAllArt() {
    const top=selectedPokemon.slice(0,3), bot=selectedPokemon.slice(3,6);
    const w=50;
    let ta=await Promise.all(top.map(p=>generateAscii(p.spriteUrl,p.name,w,true)));
    printCombinedArt(ta);
    printToTerminal(top.map(p=>centerText(`#${p.id} ${p.name}`,w)).join('  '),'text-cyan-300');
    printToTerminal(" ");
    let ba=await Promise.all(bot.map(p=>generateAscii(p.spriteUrl,p.name,w,true)));
    printCombinedArt(ba);
    printToTerminal(bot.map(p=>centerText(`#${p.id} ${p.name}`,w)).join('  '),'text-cyan-300');
}
function centerText(t,w){const p=Math.floor((w-t.length)/2);return ' '.repeat(Math.max(0,p))+t+' '.repeat(Math.max(0,w-p-t.length));}
function printCombinedArt(arts){
    const all = arts.map(a => a.split('\n'));
    const mh = Math.max(...all.map(l => l.length));
    
    // Fix: Pad with exactly 50 spaces, ignoring the HTML tag lengths
    all.forEach(l => { while(l.length < mh) l.push(' '.repeat(50)); });
    
    for(let i = 0; i < mh; i++) {
        printToTerminal(all.map(l => l[i] || ' '.repeat(50)).join('  '), 'ascii-art');
    }
}
async function generateAscii(url, fallback, maxW=60, useColor=false) {
    try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d', { willReadFrequently: true });
        const img = new Image();
        
        // Fix: Fetch the image as a Blob to prevent Tainted Canvas CORS errors
        const res = await fetch(url);
        if (!res.ok) throw new Error("Network error");
        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);
        
        await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = () => reject();
            img.src = objUrl;
        });
        
        const sc = img.width / maxW;
        const h = Math.floor(img.height / sc / 2.2);
        c.width = maxW; 
        c.height = h; 
        ctx.drawImage(img, 0, 0, maxW, h);
        
        const d = ctx.getImageData(0, 0, maxW, h).data; 
        let s = '';
        
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < maxW; x++) {
                const i = (y * maxW + x) * 4;
                if (d[i + 3] < 100) { 
                    s += ' '; 
                } else {
                    const r = d[i], g = d[i + 1], b = d[i + 2];
                    const br = (0.21 * r + 0.72 * g + 0.07 * b) / 255;
                    const ch = asciiRamp[Math.floor(br * (asciiRamp.length - 1))];
                    s += useColor ? `<span style="color:rgb(${r},${g},${b})">${ch}</span>` : ch;
                }
            }
            s += '\n';
        }
        
        URL.revokeObjectURL(objUrl); // Clean up memory
        return s;
    } catch(e) {
        console.error("Art load failed:", e);
        return '\n'.repeat(5) + centerText(`[ ${fallback} ]`, maxW) + '\n' + '\n'.repeat(5);
    }
}

async function executeBattleRound(pmi){
    const pm=currentPlayerPokemon.moves[pmi];
    const emi=Math.floor(Math.random()*4), em=currentEnemyPokemon.moves[emi];
    const pFirst=currentPlayerPokemon.speed>currentEnemyPokemon.speed||(currentPlayerPokemon.speed===currentEnemyPokemon.speed&&Math.random()>0.5);
    const f=pFirst?{a:currentPlayerPokemon,d:currentEnemyPokemon,m:pm,t:'player'}:{a:currentEnemyPokemon,d:currentPlayerPokemon,m:em,t:'enemy'};
    const s=pFirst?{a:currentEnemyPokemon,d:currentPlayerPokemon,m:em,t:'enemy'}:{a:currentPlayerPokemon,d:currentEnemyPokemon,m:pm,t:'player'};
    if(!pFirst) printToTerminal(`${currentEnemyPokemon.name} is faster! (SPE ${currentEnemyPokemon.speed} vs ${currentPlayerPokemon.speed})`,'text-orange-400');
    commandInput.disabled=true;
    executeAttack(f.a,f.d,f.m,f.t);
    if(await handleFaint(f.d,f.t==='player'?'enemy':'player')){commandInput.disabled=false;commandInput.focus();if(battleState!=='game_over')promptNextMove();return;}
    await delay(1200);
    executeAttack(s.a,s.d,s.m,s.t);
    if(await handleFaint(s.d,s.t==='player'?'enemy':'player')){commandInput.disabled=false;commandInput.focus();if(battleState!=='game_over')promptNextMove();return;}
    commandInput.disabled=false;commandInput.focus();
    printToTerminal("─────────────────",'text-gray-700');printHpStatus();promptNextMove();
}

function executeAttack(atk,def,move,team){
    const cc=team==='player'?'text-cyan-400':'text-orange-400',tc=typeColors[move.type]||'#ccc';
    const p=document.createElement('p');p.className=cc;
    p.innerHTML=`${atk.name} used <span style="color:${tc};font-weight:bold;">${move.name}</span>!`;
    terminalOutput.appendChild(p);scrollToBottom();
    const r=calculateDamage(atk,def,move);
    if(r.isStatus){printToTerminal(`${atk.name} used a status move!`,'text-gray-400');return;}
    if(r.missed){printToTerminal("...but it missed!",'text-gray-500');return;}
    if(r.effectiveness===0){printToTerminal("It had no effect...",'text-gray-600 font-bold');return;}
    def.hp=Math.max(0,def.hp-r.damage);
    if(r.effectiveness>1)printToTerminal("It's super effective!",'text-green-400 effectiveness-msg');
    else if(r.effectiveness<1)printToTerminal("It's not very effective...",'text-yellow-600');
    if(r.critical)printToTerminal("A critical hit!",'text-yellow-300 font-bold');
    printToTerminal(`${def.name} took ${r.damage} damage!`);scrollToBottom();
}

async function handleFaint(pokemon,team){
    if(pokemon.hp>0||pokemon.isFainted)return false;
    pokemon.isFainted=true;
    printToTerminal(`${pokemon.name} fainted!`,`${team==='player'?'text-cyan-400':'text-orange-400'} font-bold`);
    if(team==='player'){
        activePlayerPokemonIndex++;
        if(activePlayerPokemonIndex<playerTeam.length){
            currentPlayerPokemon=playerTeam[activePlayerPokemonIndex];
            printToTerminal(`Go, ${currentPlayerPokemon.name}!`,'text-cyan-400');
            await setPokemonArt(currentPlayerPokemon,'player');printHpStatus();
        }else endBattle(false);
    }else{
        activeEnemyPokemonIndex++;
        if(activeEnemyPokemonIndex<enemyTeam.length){
            currentEnemyPokemon=enemyTeam[activeEnemyPokemonIndex];
            printToTerminal(`Foe sent out ${currentEnemyPokemon.name}!`,'text-orange-400');
            await setPokemonArt(currentEnemyPokemon,'enemy');printHpStatus();
        }else endBattle(true);
    }
    return true;
}

function endBattle(won){
    battleState='game_over';battleArtDisplay.style.display='none';
    if(won){
        printToTerminal("═══════════════════════════════════",'text-green-400');
        printToTerminal("           YOU WIN!",'text-green-400 font-bold text-lg');
        printToTerminal("═══════════════════════════════════",'text-green-400');
        printToTerminal("Congratulations, Trainer!",'text-yellow-300');
    }else{
        printToTerminal("═══════════════════════════════════",'text-red-500');
        printToTerminal("        YOU BLACKED OUT...",'text-red-500 font-bold text-lg');
        printToTerminal("═══════════════════════════════════",'text-red-500');
        printToTerminal("Better luck next time.",'text-gray-400');
    }
    printToTerminal("Type 'reset' for new random Pokémon!",'text-gray-300');
}

function resetGame(){
    printToTerminal("Restarting...",'text-gray-400');
    battleArtDisplay.style.display='none';playerArtEl.innerHTML='';enemyArtEl.innerHTML='';
    setTimeout(()=>{
        state='init';gameCommandCounter=0;playerTeam=[];enemyTeam=[];selectedPokemon=[];
        commandToPokemonMap={};battleState='player_turn';activePlayerPokemonIndex=0;
        activeEnemyPokemonIndex=0;currentPlayerPokemon=null;currentEnemyPokemon=null;
        promptPrefix.textContent="guest@portfolio:~$";
        promptPrefix.classList.remove("text-red-500","text-yellow-400");
        promptPrefix.classList.add("text-green-400");
        terminalOutput.innerHTML='';initTerminal();
    },1000);
}

function delay(ms){return new Promise(r=>setTimeout(r,ms));}
function printToTerminal(text,cssClass='text-gray-300'){
    const p=document.createElement('p');
    if(text&&text.includes('<span'))p.innerHTML=text;
    else p.innerHTML=(text||'').replace(/</g,"&lt;").replace(/>/g,"&gt;");
    p.className=cssClass+' fade-in';terminalOutput.appendChild(p);
}
function scrollToBottom(){terminalOutput.scrollTop=terminalOutput.scrollHeight;}
function initTerminal(){
    let i=0;
    function typeLine(){
        if(i<welcomeMessage.length){printToTerminal(welcomeMessage[i]);i++;scrollToBottom();setTimeout(typeLine,150);}
        else{printToTerminal(firstQuestion,'text-yellow-300');commandInput.focus();}
    }
    terminalOutput.innerHTML='';typeLine();
}
initTerminal();
</script>
